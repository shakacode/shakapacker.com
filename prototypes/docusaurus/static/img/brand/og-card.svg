<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Shakapacker — Modern JavaScript and CSS bundling for Rails, powered by webpack or Rspack">
  <title>Shakapacker social preview card</title>

  <defs>
    <!-- Warm brand glow behind the mark for depth on the dark canvas -->
    <radialGradient id="glow" cx="22%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#E43D39" stop-opacity="0.20"/>
      <stop offset="42%" stop-color="#FF8A00" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E43D39"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="630" fill="#0D1117"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Subtle inner frame so the card reads on light feeds -->
  <rect x="1" y="1" width="1198" height="628" rx="0" fill="none" stroke="#21262D" stroke-width="2"/>
  <!-- Top accent hairline -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- Folded-S mark in its brand tile -->
  <g transform="translate(96,200) scale(0.32)" stroke-linejoin="round">
    <rect x="56" y="56" width="912" height="912" rx="186" fill="#0D1117"/>
    <rect x="66" y="66" width="892" height="892" rx="176" fill="none" stroke="#293544" stroke-width="20"/>
    <path d="M300 276 H704 L604 394 H452 L564 492 H408 L276 394 Z" fill="#E43D39"/>
    <path d="M724 628 L594 752 H224 L354 626 H506 L394 526 H552 Z" fill="#FF8A00"/>
    <path d="M300 276 H704 L604 394 H452 Z" fill="#FF5A4C" opacity="0.32"/>
    <path d="M354 626 H506 L594 752 H224 Z" fill="#E05D00" opacity="0.20"/>
  </g>

  <!-- Wordmark + tagline -->
  <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="486" y="296" font-size="96" font-weight="800" letter-spacing="-2.5" fill="#E6EDF3">Shakapacker</text>

    <!-- Accent underline -->
    <rect x="490" y="324" width="132" height="9" rx="4.5" fill="url(#accent)"/>

    <text x="488" y="408" font-size="38" font-weight="500" fill="#ADBAC7">Modern JavaScript &amp; CSS bundling</text>
    <text x="488" y="458" font-size="38" font-weight="500" fill="#ADBAC7">for Rails applications</text>

    <text x="488" y="540" font-size="32" font-weight="600" fill="#8B949E">Powered by <tspan fill="#FF6B5E" font-weight="700">webpack</tspan> or <tspan fill="#FF9E33" font-weight="700">Rspack</tspan></text>
  </g>

  <!-- Domain, bottom-right -->
  <text x="1112" y="586" text-anchor="end" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="0.5" fill="#6E7681">shakapacker.com</text>
</svg>
